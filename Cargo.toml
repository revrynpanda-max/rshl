[package]
name = "kai"
version = "9.9.0"
edition = "2021"
authors = ["Ryan Ervin <PandaProductionsLogo>"]
description = "KAI RSHL UI — Geometric Intelligence Engine"
license = "MIT"

[lib]
name = "kai"
path = "src/lib.rs"

[[bin]]
name = "kai"
path = "src/main.rs"

[[bin]]
name = "test_gguf"
path = "src/bin/test_gguf.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
rand = "0.8"
unicode-width = "0.2"
crossbeam-channel = "0.5"
rayon = "1.10"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
lopdf = "0.34"
sysinfo = "0.31"
hnsw_rs = "0.3"
anndists = "0.1"
roaring = { version = "0.10", features = ["serde"] }
wgpu = { version = "22.1", optional = true }
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"], optional = true }
zstd = "0.13"
memmap2 = "0.9"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.23.1"
num_cpus = "1.17.0"
tracing = "0.1.44"

[profile.release]
opt-level = 3
lto = false
codegen-units = 16

[features]
default = ["gpu"]
gpu = ["wgpu", "bytemuck"]
sparsity_010 = []
# Put the BitNet LLM on an NVIDIA GPU via Candle's CUDA backend. OFF by default
# so the normal build needs no CUDA toolkit. Once the CUDA toolkit is installed,
# build with `--features llm-cuda` and the LLM auto-selects the GPU (CPU fallback
# stays intact). Pairs with the cuda_if_available device selection in
# language_warehouse.rs.
llm-cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

