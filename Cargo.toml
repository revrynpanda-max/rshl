[package]
name = "kai"
version = "8.4.15"
edition = "2021"
authors = ["Ryan Ervin <PandaProductionsLogo>"]
description = "KAI RSHL UI — Geometric Intelligence Engine"
license = "MIT"

[lib]
name = "kai"
path = "src/lib.rs"

[[bin]]
name = "kai"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
rand = "0.8"
unicode-width = "0.2"
crossbeam-channel = "0.5"
rayon = "1.10"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
lopdf = "0.34"
sysinfo = "0.31"
hnsw_rs = "0.3"
anndists = "0.1"
roaring = { version = "0.10", features = ["serde"] }
wgpu = "22.1"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
zstd = "0.13"
memmap2 = "0.9"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = "0.23.1"
num_cpus = "1.17.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
sparsity_010 = []

